name: cityportal

x-backend-environment: &backend-environment
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_HTTP_PORTS: 8080
  ConnectionStrings__Database: Host=postgres;Port=5432;Database=cityportal;Username=cityportal;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env};GSS Encryption Mode=Disable
  ConnectionStrings__Messaging: amqp://${RABBITMQ_USER:-cityportal}:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}@rabbitmq:5672
  Security__DataProtectionKeysPath: /var/cityportal/keys
  Security__TrustedProxies__0: ${PROXY_ADDRESS:-172.30.88.10}
  Mail__PublicOrigin: ${PUBLIC_ORIGIN:-https://localhost:8443}
  Mail__SmtpHost: mailpit
  Mail__SmtpPort: 1025
  Mail__UseTls: 'false'
  Mail__SenderAddress: noreply@cityportal.test
  Mail__PortalName: CityPortal
  City__TimeZone: ${CITY_TIME_ZONE:-UTC}
  Installation__Enabled: 'true'
  Media__Endpoint: http://media-store:9000
  Media__AllowHttp: 'true'
  Media__AccessKey: ${MEDIA_ACCESS_KEY:?Set MEDIA_ACCESS_KEY in .env}
  Media__SecretKey: ${MEDIA_SECRET_KEY:?Set MEDIA_SECRET_KEY in .env}
  Media__Bucket: cityportal-media

services:
  pgadmin:
    image: dpage/pgadmin4:9.19@sha256:3591b3d02910dcd817dec6fcaa681c278ba6966945283dd0ea0042731c330c83
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-pgadmin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}}
      PGADMIN_DISABLE_POSTFIX: 'true'
    ports:
      - 127.0.0.1:5050:80
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, /venv/bin/python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1/misc/ping', timeout=5)"]
      interval: 5s
      timeout: 10s
      retries: 30
  media-store:
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    environment:
      RUSTFS_ACCESS_KEY: ${MEDIA_ACCESS_KEY:?Set MEDIA_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${MEDIA_SECRET_KEY:?Set MEDIA_SECRET_KEY in .env}
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: 'false'
    ports:
      - 127.0.0.1:9000:9000
    volumes:
      - media-data:/data
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:9000/health]
      interval: 5s
      timeout: 5s
      retries: 20
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: cityportal
      POSTGRES_USER: cityportal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-cityportal}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - 127.0.0.1:5672:5672
      - 127.0.0.1:15672:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - 127.0.0.1:1025:1025
      - 127.0.0.1:8025:8025
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit-data:/data

  api:
    build:
      context: .
      dockerfile: infra/docker/Api.Dockerfile
    environment: *backend-environment
    volumes:
      - protection-keys:/var/cityportal/keys
    ports:
      - 127.0.0.1:5080:8080
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: infra/docker/Worker.Dockerfile
    environment: *backend-environment
    volumes:
      - protection-keys:/var/cityportal/keys
    ports:
      - 127.0.0.1:5081:8080
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      TRUST_PROXY_HEADERS: 'true'
      API_INTERNAL_ORIGIN: http://api:8080

  proxy:
    image: caddy:2.11.9-alpine
    ports:
      - 127.0.0.1:8443:8443
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - frontend
    networks:
      default:
        ipv4_address: ${PROXY_ADDRESS:-172.30.88.10}

networks:
  default:
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-172.30.88.0/24}

volumes:
  pgadmin-data:
  media-data:
  postgres-data:
  rabbitmq-data:
  mailpit-data:
  caddy-data:
  caddy-config:
  protection-keys:
