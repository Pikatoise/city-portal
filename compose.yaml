name: cityportal

x-backend-environment: &backend-environment
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_HTTP_PORTS: 8080
  ConnectionStrings__Database: Host=postgres;Port=5432;Database=cityportal;Username=cityportal;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env};GSS Encryption Mode=Disable
  ConnectionStrings__Messaging: amqp://${RABBITMQ_USER:-cityportal}:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}@rabbitmq:5672
  Security__DataProtectionKeysPath: /var/cityportal/keys
  Security__TrustedProxies__0: ${PROXY_ADDRESS:-172.30.88.10}
  Mail__PublicOrigin: https://localhost:8443
  Mail__SmtpHost: mailpit
  Mail__SmtpPort: 1025
  Mail__UseTls: 'false'
  Mail__SenderAddress: noreply@cityportal.test
  Mail__PortalName: CityPortal

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: cityportal
      POSTGRES_USER: cityportal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-cityportal}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - 127.0.0.1:5672:5672
      - 127.0.0.1:15672:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - 127.0.0.1:1025:1025
      - 127.0.0.1:8025:8025
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit-data:/data

  api:
    build:
      context: .
      dockerfile: infra/docker/Api.Dockerfile
    environment: *backend-environment
    volumes:
      - protection-keys:/var/cityportal/keys
    ports:
      - 127.0.0.1:5080:8080
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: infra/docker/Worker.Dockerfile
    environment: *backend-environment
    volumes:
      - protection-keys:/var/cityportal/keys
    ports:
      - 127.0.0.1:5081:8080
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      TRUST_PROXY_HEADERS: 'true'

  proxy:
    image: caddy:2.11.9-alpine
    ports:
      - 127.0.0.1:8443:8443
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - frontend
    networks:
      default:
        ipv4_address: ${PROXY_ADDRESS:-172.30.88.10}

networks:
  default:
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-172.30.88.0/24}

volumes:
  postgres-data:
  rabbitmq-data:
  mailpit-data:
  caddy-data:
  caddy-config:
  protection-keys:
