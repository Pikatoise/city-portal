services:
  api:
    environment:
      Integrations__UseLocalStubs: 'true'
      Integrations__Telegram__BotToken: '1234:local_stub'
      Integrations__OpenAI__ApiKey: local-stub
    depends_on:
      integration-stubs:
        condition: service_healthy

  worker:
    environment:
      Integrations__UseLocalStubs: 'true'
      Integrations__Telegram__BotToken: '1234:local_stub'
    depends_on:
      integration-stubs:
        condition: service_healthy

  integration-stubs:
    image: node:26.8.1-bookworm-slim
    command: [node, /app/server.mjs]
    ports:
      - 127.0.0.1:8090:8080
    volumes:
      - ./infra/integration-stubs/server.mjs:/app/server.mjs:ro
      - integration-stub-posts:/data
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  integration-stub-posts:
