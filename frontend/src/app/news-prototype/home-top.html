<header class="home-top design-A">
  <div class="top-inner">
    <div class="portal-line">
      <div class="identity">
        <a class="brand" routerLink="/" [queryParams]="{ screen: 'home' }"
          >{{ name() }}<span aria-hidden="true"></span
        ></a>
        <div class="city-weather">
          <div class="city-date">
            <span>{{ city() }}</span><time>{{ today }}</time>
          </div>
          <span
            class="temperature"
            aria-label="Демонстрационная температура: плюс 3 градуса Цельсия"
            title="Демонстрационные данные"
            >+3 °C</span
          >
        </div>
      </div>
      <nav aria-label="Основная навигация">
        <a class="active" routerLink="/" [queryParams]="{ screen: 'home' }">Главная</a
        ><a routerLink="/" [queryParams]="{ screen: 'editor' }">Редактор статьи ↗</a>
      </nav>
    </div>
  </div>
</header>
@if (showCategories()) {
  <div class="portal-tools">
    <nav class="category-links" aria-label="Категории новостей">
      <button (click)="category.emit('')">Последние</button>
      @for (item of categories(); track item) {
        <button (click)="category.emit(item)">{{ item }}</button>
      }
      <button (click)="allNews.emit()">Все новости</button>
    </nav>
    <form (ngSubmit)="search.emit(searchText)" role="search">
      <input
        name="portal-search"
        [(ngModel)]="searchText"
        aria-label="Поиск новостей"
        placeholder="Поиск по новостям"
      /><button aria-label="Найти новости">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path d="m16 16 4.5 4.5" />
        </svg>
      </button>
    </form>
  </div>
}
