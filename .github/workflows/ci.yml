name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore CityPortal.slnx
      - name: Check formatting
        run: dotnet format CityPortal.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build CityPortal.slnx --configuration Release --no-restore
      - name: Test against real infrastructure
        run: dotnet test CityPortal.slnx --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.8.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run api:check
      - run: npm run build
      - run: npm test -- --watch=false

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Initialize local-only CI credentials
        shell: bash
        run: |
          printf 'POSTGRES_PASSWORD=%s\nRABBITMQ_USER=cityportal\nRABBITMQ_PASSWORD=%s\n' "$(openssl rand -hex 24)" "$(openssl rand -hex 24)" > .env
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build
      - name: Start infrastructure
        run: docker compose up --detach --wait postgres rabbitmq mailpit
      - name: Apply migrations explicitly
        run: docker compose run --rm --no-deps api --migrate
      - name: Start application
        run: docker compose up --detach api worker frontend proxy
      - name: Check API and Worker readiness
        shell: bash
        run: |
          curl --fail --retry 20 --retry-all-errors --retry-delay 2 http://localhost:5080/health/ready
          curl --fail --retry 20 --retry-all-errors --retry-delay 2 http://localhost:5081/health/ready
      - name: Check HTTPS origin
        shell: bash
        run: |
          for attempt in $(seq 1 20); do
            if docker compose cp proxy:/data/caddy/pki/authorities/local/root.crt /tmp/cityportal-root.crt; then break; fi
            printf 'Waiting for local CA certificate (attempt %s/20)\n' "$attempt"
            sleep 2
          done
          test -s /tmp/cityportal-root.crt
          curl --fail --retry 20 --retry-all-errors --retry-delay 2 --cacert /tmp/cityportal-root.crt https://localhost:8443/api/system/info
          curl --fail --cacert /tmp/cityportal-root.crt https://localhost:8443/ > /tmp/cityportal.html
          grep -q '<app-root' /tmp/cityportal.html
      - name: Check live OpenAPI contract against client snapshot
        run: |
          curl --fail http://localhost:5080/openapi/v1.json > /tmp/cityportal-openapi.json
          python3 scripts/check-openapi.py frontend/openapi.json /tmp/cityportal-openapi.json
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --tail 100
      - name: Stop containers
        if: always()
        run: docker compose down
